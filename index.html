<style>

/* =====================================
   НЕГІЗГІ ТҮСТЕР
===================================== */

:root {
  --dark:#112f27;
  --green:#167348;
  --blue:#176bc2;
  --red:#d53138;
  --gold:#b88e50;
  --cream:#f7f5ef;
  --text:#24382e;
}

* {
  box-sizing:border-box;
}

html,body {
  margin:0;
  width:100%;
  height:100%;
}

body {
  background:#0d2921;
  font-family:"Manrope","Noto Sans",sans-serif;
  overflow:hidden;
}

button {
  font-family:inherit;
}

/* =====================================
   САЙТТЫҢ ҚҰРЫЛЫМЫ
===================================== */

.app {
  height:100dvh;
  width:100%;
  display:flex;
  flex-direction:column;
  padding:10px 18px;
  gap:9px;
}

header {
  height:48px;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
  font-size:18px;
  font-weight:800;
}

.brand {
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-icon {
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:2px solid #cba96c;
  border-radius:11px;
  color:#e4c68c;
  font-family:Georgia,serif;
  font-size:24px;
}

.header-right {
  font-size:15px;
  color:#dfc18d;
}

/* =====================================
   ПРЕЗЕНТАЦИЯ ЭКРАНЫ
===================================== */

.stage {
  position:relative;
  flex:1;
  min-height:0;
  border-radius:24px;
  overflow:hidden;
  background:var(--cream);
  box-shadow:0 22px 65px #0005;
}

.stage::before {
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:10px;
  background:linear-gradient(
    180deg,#d6aa67,#1a6a48
  );
  z-index:10;
}

/* =====================================
   СЛАЙД
===================================== */

.slide {
  position:absolute;
  inset:0;
  display:none;
  overflow-y:auto;
  padding:clamp(22px,3.3vw,50px);
  background:
    radial-gradient(
      circle at 85% 12%,
      #e7d8bb70,
      transparent 40%
    ),
    var(--cream);
  animation:show .35s ease;
}

.slide.active {
  display:block;
}

@keyframes show {
  from {
    opacity:0;
    transform:translateY(12px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.layout {
  width:100%;
  min-height:100%;
  display:grid;
  grid-template-columns:
    minmax(0,1.12fr)
    minmax(0,.88fr);
  gap:clamp(22px,3vw,48px);
  align-items:center;
}

.content {
  min-width:0;
}

/* =====================================
   МӘТІНДЕР
===================================== */

.kicker {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  font-size:clamp(14px,1.12vw,19px);
  font-weight:800;
  letter-spacing:.1em;
  color:#6b866e;
}

.kicker::before {
  content:"";
  width:43px;
  height:5px;
  background:var(--gold);
  border-radius:10px;
}

h1,h2,p {
  margin-top:0;
}

h1 {
  font-size:clamp(49px,5.7vw,91px);
  line-height:1.06;
  letter-spacing:-.05em;
  font-weight:800;
  color:var(--dark);
  margin-bottom:26px;
}

h2 {
  font-size:clamp(38px,3.75vw,62px);
  line-height:1.12;
  letter-spacing:-.035em;
  font-weight:800;
  color:var(--dark);
  margin-bottom:20px;
}

.lead {
  font-size:clamp(23px,2vw,33px);
  font-weight:800;
  line-height:1.43;
  color:#a07a43;
  margin-bottom:18px;
}

.paragraph {
  font-size:clamp(20px,1.8vw,29px);
  line-height:1.6;
  font-weight:600;
  color:var(--text);
  margin-bottom:14px;
}

/* =====================================
   ТҮСТІ СӨЗДЕР
===================================== */

.red {
  color:var(--red);
  font-weight:800;
}

.blue {
  color:var(--blue);
  font-weight:800;
}

.green {
  color:var(--green);
  font-weight:800;
}

.gold {
  color:#ad7a31;
  font-weight:800;
}

/* =====================================
   ТІЗІМДЕР
===================================== */

.points {
  display:grid;
  gap:11px;
  margin-top:16px;
}

.point {
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 16px;
  border:1px solid #e2dfd5;
  background:#fffefa;
  border-radius:14px;
  font-size:clamp(19px,1.6vw,26px);
  font-weight:700;
  line-height:1.4;
}

.point::before {
  content:"";
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--gold);
  flex-shrink:0;
}

.note {
  margin-top:17px;
  padding:17px 20px;
  background:#e5ece2;
  border-left:6px solid var(--gold);
  border-radius:0 15px 15px 0;
  color:#28543f;
  font-size:clamp(19px,1.6vw,27px);
  font-weight:800;
  line-height:1.5;
}

/* =====================================
   ФОТОСУРЕТТЕР
===================================== */

.image-side {
  position:relative;
  height:min(68vh,600px);
  min-height:280px;
  overflow:hidden;
  border-radius:23px;
  background:#dfe6de;
  border:1px solid #d4dad1;
  box-shadow:0 16px 45px #14382728;
}

.image-side img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.image-side.contain img {
  object-fit:contain;
  padding:10px;
}

.image-side::after {
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid #ffffff85;
  border-radius:16px;
  pointer-events:none;
}

.image-caption {
  position:absolute;
  bottom:13px;
  left:13px;
  right:13px;
  padding:12px 15px;
  border-radius:11px;
  background:#102f27e8;
  color:white;
  text-align:center;
  font-size:clamp(14px,1vw,18px);
  font-weight:800;
  line-height:1.4;
  z-index:3;
}

/* =====================================
   БІРІНШІ БЕТ
===================================== */

.cover h1 span {
  color:#b68b4c;
}

.cover-meta {
  margin-top:30px;
  display:grid;
  gap:12px;
  font-size:clamp(21px,1.7vw,28px);
  font-weight:700;
}

.cover-meta strong {
  color:var(--green);
}

/* =====================================
   16-БЕТ: ҚОШТАСУ
===================================== */

.farewell {
  background:
    radial-gradient(
      circle at 80% 15%,
      #aa945a45,
      transparent 35%
    ),
    linear-gradient(
      135deg,#163b30,#0b211b
    );
  text-align:center;
}

.farewell::before {
  content:"";
  position:absolute;
  inset:24px;
  border:2px solid #b99a6190;
  border-radius:24px;
  pointer-events:none;
}

.farewell-layout {
  min-height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
  position:relative;
  z-index:1;
}

.farewell-label {
  font-size:clamp(17px,1.5vw,24px);
  font-weight:800;
  color:#d2b078;
  letter-spacing:.2em;
}

.farewell h2 {
  font-size:clamp(46px,5.5vw,92px);
  line-height:1.15;
  color:#fff8e9;
  text-align:center;
  max-width:1100px;
  margin:10px 0;
  text-shadow:0 7px 30px #0005;
}

.farewell h2 span {
  color:#d8b776;
}

.farewell-line {
  width:160px;
  height:5px;
  border-radius:10px;
  background:linear-gradient(
    90deg,transparent,#e2c38e,transparent
  );
}

.farewell-book {
  width:clamp(100px,11vw,175px);
  height:clamp(100px,11vw,175px);
  border-radius:50%;
  object-fit:cover;
  border:4px solid #d5b67c;
  box-shadow:0 12px 35px #0006;
}

.farewell-author {
  padding:17px 32px;
  border:1px solid #c9a56e;
  border-radius:17px;
  color:#fff8e9;
  background:#ffffff12;
  font-size:clamp(24px,2.7vw,43px);
  font-weight:800;
}

.farewell-author strong {
  color:#e0bf83;
}

.farewell-footer {
  color:#c6d2c4;
  font-size:clamp(16px,1.4vw,23px);
  font-weight:700;
}

/* =====================================
   БАСҚАРУ
===================================== */

footer {
  height:55px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.buttons {
  display:flex;
  gap:10px;
}

.btn {
  padding:11px 19px;
  min-height:44px;
  border-radius:12px;
  border:1px solid #70927b;
  background:#285542;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.btn:hover {
  background:#46745a;
}

.btn:disabled {
  opacity:.35;
  cursor:default;
}

.btn.primary {
  background:#d4ad70;
  color:#173629;
  border-color:#d4ad70;
}

.progress {
  flex:1;
  max-width:360px;
  height:8px;
  border-radius:20px;
  background:#42614f;
  overflow:hidden;
}

.progress-fill {
  width:0;
  height:100%;
  background:#e2c389;
  transition:width .3s;
}

.counter {
  color:white;
  font-size:17px;
  font-weight:800;
  white-space:nowrap;
}

/* =====================================
   КІШКЕНТАЙ ЭКРАН
===================================== */

@media(max-height:740px) {
  .app {
    padding:6px 14px;
    gap:5px;
  }

  header { height:36px; }
  footer { height:42px; }

  .slide {
    padding:20px 31px;
  }

  h2 {
    font-size:clamp(31px,3vw,48px);
    margin-bottom:13px;
  }

  .lead {
    font-size:clamp(21px,1.7vw,28px);
    margin-bottom:10px;
  }

  .paragraph {
    font-size:clamp(18px,1.5vw,24px);
    line-height:1.43;
    margin-bottom:9px;
  }

  .point {
    padding:8px 13px;
    font-size:clamp(18px,1.4vw,23px);
  }

  .note {
    padding:10px 15px;
    font-size:20px;
  }

  .kicker {
    margin-bottom:10px;
  }

  .btn {
    min-height:35px;
    padding:7px 13px;
  }
}

@media(max-width:850px) {
  .app {
    padding:6px;
    gap:6px;
  }

  header {
    height:43px;
    font-size:12px;
    padding:0 8px;
  }

  .brand-icon {
    width:31px;
    height:31px;
    font-size:19px;
  }

  .header-right {
    font-size:11px;
  }

  .stage {
    border-radius:15px;
  }

  .slide {
    padding:25px 20px;
  }

  .slide-layout,
  .layout {
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:18px;
  }

  h1 { font-size:48px; }
  h2 { font-size:35px; }

  .lead { font-size:22px; }

  .paragraph {
    font-size:20px;
    line-height:1.5;
  }

  .point { font-size:19px; }
  .note { font-size:19px; }

  .image-side {
    height:330px;
    min-height:330px;
  }

  footer { height:47px; }

  .btn {
    font-size:12px;
    padding:8px 10px;
    min-height:38px;
  }

  .progress { display:none; }
  .counter { font-size:13px; }

  .farewell h2 { font-size:43px; }
  .farewell-author { font-size:27px; }
}

</style>

function createFallback(index) {

  // Интернеттен сурет ашылмаған жағдайда
  // көрсетілетін қарапайым кітап кескіні.

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 800 900">

    <defs>
      <linearGradient id="bg" x1="0" y1="0"
                      x2="1" y2="1">
        <stop stop-color="#224c3e"/>
        <stop offset="1" stop-color="#10261f"/>
      </linearGradient>
    </defs>

    <rect width="800" height="900"
          fill="url(#bg)"/>

    <circle cx="${600-index*12}"
            cy="180"
            r="220"
            fill="#c5a36c"
            opacity=".15"/>

    <rect x="105" y="130"
          width="590" height="640"
          rx="30"
          fill="none"
          stroke="#d6b982"
          stroke-width="5"/>

    <path d="M400 310
      Q290 255 180 310
      L180 630
      Q290 585 400 650Z"
      fill="#f0e4ce"/>

    <path d="M400 310
      Q510 255 620 310
      L620 630
      Q510 585 400 650Z"
      fill="#96b09a"/>

    <path d="M400 315 L400 650"
          stroke="#d2aa6e"
          stroke-width="8"/>

    <g stroke="#a9977a" stroke-width="5">
      <path d="M215 380 Q300 350 365 395"/>
      <path d="M215 450 Q300 420 365 465"/>
      <path d="M215 520 Q300 490 365 535"/>
    </g>

    <g stroke="#e3ece0" stroke-width="5">
      <path d="M435 395 Q500 350 585 380"/>
      <path d="M435 465 Q500 420 585 450"/>
      <path d="M435 535 Q500 490 585 520"/>
    </g>

  </svg>`;

  return "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(svg);
}

function loadAlternative(img,index) {

  const list=PHOTO_LIST[index];
  const next=Number(img.dataset.try||0)+1;

  if(next<list.length) {
    img.dataset.try=next;
    img.src=list[next];
  } else {
    img.onerror=null;
    img.src=createFallback(index);
  }
}

/* =====================================
   15 СЛАЙДТЫ ҚҰРАСТЫРУ
===================================== */

function makeSlide(item,index) {

  const titleTag=item.cover?"h1":"h2";

  const paragraphs=item.body.map(t=>
    `<p class="paragraph">${t}</p>`
  ).join("");

  const points=item.points.length
    ? `<div class="points">
        ${item.points.map(t=>
          `<div class="point">${t}</div>`
        ).join("")}
      </div>`
    : "";

  const note=item.note
    ? `<div class="note">${item.note}</div>`
    : "";

  const meta=item.cover
    ? `<div class="cover-meta">
        <div>
          <strong>Орындаған:</strong> Шырай
        </div>
        <div>
          <strong>Пәні:</strong> Қазақ әдебиеті
        </div>
        <div>
          <strong>2026 жыл</strong>
        </div>
      </div>`
    : "";

  return `
  <section class="slide ${item.cover?"cover":""}">
    <div class="layout">

      <div class="content">

        <div class="kicker">${item.tag}</div>

        <${titleTag}>
          ${item.title}
        </${titleTag}>

        <div class="lead">${item.lead}</div>

        ${paragraphs}
        ${points}
        ${note}
        ${meta}

      </div>

      <div class="image-side ${item.contain?"contain":""}">

        <img
          src="${PHOTO_LIST[index][0]}"
          data-try="0"
          alt="${item.caption}"
          loading="eager"
          onerror="loadAlternative(this,${index})"
        >

        <div class="image-caption">
          ${item.caption}
        </div>

      </div>

    </div>
  </section>`;
}

/* =====================================
   БАРЛЫҚ 16 БЕТТІ ШЫҒАРУ
===================================== */

const slidesRoot=document.getElementById("slides");

slidesRoot.innerHTML=
  DATA.map(makeSlide).join("")+
  makeFarewell();

const slides=document.querySelectorAll(".slide");

let current=0;

const prev=document.getElementById("prev");
const next=document.getElementById("next");

const counter=document.getElementById("counter");
const progress=document.getElementById("progress");

/* =====================================
   СЛАЙД АУЫСТЫРУ
===================================== */

function showSlide(n) {

  current=Math.max(
    0,
    Math.min(n,slides.length-1)
  );

  slides.forEach((slide,i)=>{
    slide.classList.toggle("active",i===current);
  });

  counter.textContent=
    String(current+1).padStart(2,"0")+
    " / "+
    String(slides.length).padStart(2,"0");

  progress.style.width=
    ((current+1)/slides.length*100)+"%";

  prev.disabled=current===0;
  next.disabled=current===slides.length-1;

  slides[current].scrollTop=0;
}

prev.addEventListener("click",()=>{
  showSlide(current-1);
});

next.addEventListener("click",()=>{
  showSlide(current+1);
});

/* =====================================
   ПЕРНЕТАҚТАМЕН БАСҚАРУ
===================================== */

document.addEventListener("keydown",e=>{

  if(["ArrowRight","PageDown"," "].includes(e.key)){
    e.preventDefault();
    showSlide(current+1);
  }

  if(["ArrowLeft","PageUp"].includes(e.key)){
    e.preventDefault();
    showSlide(current-1);
  }

  if(e.key==="Home"){
    showSlide(0);
  }

  if(e.key==="End"){
    showSlide(slides.length-1);
  }

});

/* =====================================
   ТОЛЫҚ ЭКРАН
===================================== */

document.getElementById("fullscreen")
.addEventListener("click",async()=>{

  try {

    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }

  } catch(error) {
    console.log("Толық экран ашылмады",error);
  }

});

/* =====================================
   ТЕЛЕФОНДА САУСАҚПЕН АУЫСТЫРУ
===================================== */

let startX=0;
let startY=0;

const stage=document.getElementById("stage");

stage.addEventListener("touchstart",e=>{
  startX=e.changedTouches[0].screenX;
  startY=e.changedTouches[0].screenY;
},{passive:true});

stage.addEventListener("touchend",e=>{

  const dx=e.changedTouches[0].screenX-startX;
  const dy=e.changedTouches[0].screenY-startY;

  if(Math.abs(dx)>65 &&
     Math.abs(dx)>Math.abs(dy)*1.3){

    if(dx<0){
      showSlide(current+1);
    } else {
      showSlide(current-1);
    }

  }

},{passive:true});

/* =====================================
   БАСТАПҚЫ БЕТ
===================================== */

showSlide(0);

</script>
